<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Plan of Record vs State of Record, linked live by Projectr</title>
  <desc id="desc">Split composition: a clean, static Plan of Record panel on the left, a live, granular State of Record panel on the right, with Projectr as bidirectional arrows between them.</desc>

  <rect id="paper" x="0" y="0" width="1200" height="560" fill="#fbfaf7"/>

  <g id="panels" font-family="Georgia, 'Times New Roman', serif">

    <!-- ============ LEFT: PLAN OF RECORD ============ -->
    <g id="panel-plan">
      <rect id="panel-plan-bg" x="40" y="40" width="440" height="480" fill="#ffffff" stroke="#d8d4cc" stroke-width="1"/>
      <text id="panel-plan-title" x="72" y="98" font-size="23" letter-spacing="4" fill="#5a5a5a">PLAN OF RECORD</text>
      <text id="panel-plan-caption" x="72" y="128" font-size="18" font-style="italic" fill="#8a8a8a">what was intended</text>

      <!-- schedule: neat grid, aligned bars -->
      <g id="plan-schedule">
        <g id="plan-grid" stroke="#e6e3dc" stroke-width="1">
          <line x1="196" y1="150" x2="196" y2="322"/>
          <line x1="259" y1="150" x2="259" y2="322"/>
          <line x1="322" y1="150" x2="322" y2="322"/>
          <line x1="385" y1="150" x2="385" y2="322"/>
          <line x1="448" y1="150" x2="448" y2="322"/>
        </g>
        <g id="plan-schedule-labels" font-size="17" fill="#6a6e75">
          <text x="72" y="173">Structure</text>
          <text x="72" y="207">Envelope</text>
          <text x="72" y="241">MEP</text>
          <text x="72" y="275">Finishes</text>
          <text x="72" y="309">Closeout</text>
        </g>
        <g id="plan-schedule-bars" fill="#9a9ea6">
          <rect x="196" y="158" width="126" height="15"/>
          <rect x="259" y="192" width="108" height="15"/>
          <rect x="301" y="226" width="96" height="15"/>
          <rect x="343" y="260" width="105" height="15"/>
          <rect x="413" y="294" width="35" height="15"/>
        </g>
      </g>

      <!-- drawing linework: elevation, thin and regular -->
      <g id="plan-drawing" stroke="#8e9299" stroke-width="1.5" fill="none">
        <line x1="72" y1="486" x2="448" y2="486" stroke="#c3c6cb"/>
        <rect x="88" y="386" width="112" height="100"/>
        <line x1="116" y1="386" x2="116" y2="486" stroke-width="1"/>
        <line x1="144" y1="386" x2="144" y2="486" stroke-width="1"/>
        <line x1="172" y1="386" x2="172" y2="486" stroke-width="1"/>
        <line x1="88" y1="419" x2="200" y2="419" stroke-width="1"/>
        <line x1="88" y1="452" x2="200" y2="452" stroke-width="1"/>
        <rect x="212" y="418" width="42" height="68"/>
        <line x1="212" y1="452" x2="254" y2="452" stroke-width="1"/>
      </g>

      <!-- contract text: straight, even lines -->
      <g id="plan-contract-lines" fill="#c3c6cb">
        <rect x="276" y="382" width="172" height="3"/>
        <rect x="276" y="395" width="151" height="3"/>
        <rect x="276" y="408" width="172" height="3"/>
        <rect x="276" y="421" width="160" height="3"/>
        <rect x="276" y="434" width="172" height="3"/>
        <rect x="276" y="447" width="138" height="3"/>
        <rect x="276" y="460" width="166" height="3"/>
        <rect x="276" y="473" width="96" height="3"/>
      </g>
    </g>

    <!-- ============ RIGHT: STATE OF RECORD ============ -->
    <g id="panel-state">
      <rect id="panel-state-bg" x="720" y="40" width="440" height="480" fill="#fbf5ee" stroke="#d8d4cc" stroke-width="1"/>
      <text id="panel-state-title" x="752" y="98" font-size="23" letter-spacing="4" fill="#5a5a5a">STATE OF RECORD</text>
      <text id="panel-state-caption" x="752" y="128" font-size="18" font-style="italic" fill="#a2542f">what is happening</text>

      <!-- scattered document thumbnails, skewed, timestamped -->
      <g id="state-docs" stroke="#b98a5e" stroke-width="1.5" fill="#ffffff">
        <g id="state-doc-1" transform="rotate(-7 806 196)">
          <rect x="773" y="152" width="66" height="88"/>
          <g stroke="#d9c3a8" stroke-width="2" fill="none">
            <line x1="781" y1="166" x2="831" y2="166"/>
            <line x1="781" y1="176" x2="831" y2="176"/>
            <line x1="781" y1="186" x2="822" y2="186"/>
            <line x1="781" y1="196" x2="831" y2="196"/>
          </g>
        </g>
        <g id="state-doc-2" transform="rotate(5 892 210)">
          <rect x="859" y="166" width="66" height="88"/>
          <g stroke="#d9c3a8" stroke-width="2" fill="none">
            <line x1="867" y1="180" x2="917" y2="180"/>
            <line x1="867" y1="190" x2="910" y2="190"/>
            <line x1="867" y1="200" x2="917" y2="200"/>
          </g>
          <polyline points="925,166 925,178 913,166" fill="#fbf5ee"/>
        </g>
        <g id="state-doc-3" transform="rotate(-3 986 192)">
          <rect x="953" y="148" width="66" height="88"/>
          <g stroke="#d9c3a8" stroke-width="2" fill="none">
            <line x1="961" y1="162" x2="1011" y2="162"/>
            <line x1="961" y1="172" x2="1011" y2="172"/>
            <line x1="961" y1="182" x2="1004" y2="182"/>
            <line x1="961" y1="192" x2="1011" y2="192"/>
            <line x1="961" y1="202" x2="998" y2="202"/>
          </g>
        </g>
        <g id="state-doc-4" transform="rotate(8 1074 214)">
          <rect x="1041" y="170" width="66" height="88"/>
          <g stroke="#d9c3a8" stroke-width="2" fill="none">
            <line x1="1049" y1="184" x2="1099" y2="184"/>
            <line x1="1049" y1="194" x2="1099" y2="194"/>
            <line x1="1049" y1="204" x2="1090" y2="204"/>
          </g>
        </g>
        <g id="state-doc-5" transform="rotate(-9 878 366)">
          <rect x="845" y="322" width="66" height="88"/>
          <g stroke="#d9c3a8" stroke-width="2" fill="none">
            <line x1="853" y1="336" x2="903" y2="336"/>
            <line x1="853" y1="346" x2="896" y2="346"/>
            <line x1="853" y1="356" x2="903" y2="356"/>
            <line x1="853" y1="366" x2="890" y2="366"/>
          </g>
        </g>
      </g>

      <!-- timestamps -->
      <g id="state-timestamps" font-size="15" fill="#a2542f">
        <text x="770" y="262" transform="rotate(-3 770 262)">Tue 09:41</text>
        <text x="866" y="278" transform="rotate(2 866 278)">Wed 14:02</text>
        <text x="952" y="258" transform="rotate(-2 952 258)">Thu 16:37</text>
        <text x="1038" y="282" transform="rotate(3 1038 282)">Fri 07:15</text>
        <text x="848" y="432" transform="rotate(-4 848 432)">Mon 08:12</text>
      </g>

      <!-- site photo thumbnail -->
      <g id="state-photo" transform="rotate(2 800 348)">
        <rect x="752" y="304" width="96" height="76" fill="#efe4d6" stroke="#b98a5e" stroke-width="1.5"/>
        <line x1="752" y1="356" x2="848" y2="356" stroke="#c9a27a" stroke-width="2"/>
        <polyline points="770,356 800,314 830,356" fill="none" stroke="#a2542f" stroke-width="2"/>
        <line x1="800" y1="314" x2="800" y2="356" stroke="#a2542f" stroke-width="2"/>
      </g>

      <!-- field notes: uneven strokes, circled annotation, arrow -->
      <g id="state-notes">
        <g stroke="#6f5b4a" stroke-width="2" fill="none" stroke-linecap="round">
          <line x1="948" y1="316" x2="1112" y2="310"/>
          <line x1="950" y1="332" x2="1088" y2="330"/>
          <line x1="946" y1="348" x2="1120" y2="344"/>
          <line x1="952" y1="364" x2="1062" y2="362"/>
        </g>
        <ellipse cx="1032" cy="345" rx="98" ry="26" transform="rotate(-3 1032 345)" fill="none" stroke="#a2542f" stroke-width="1.5" stroke-dasharray="5 4"/>
        <polyline points="1016,392 1000,410 1006,402" fill="none" stroke="#a2542f" stroke-width="2"/>
        <line x1="1016" y1="392" x2="962" y2="424" stroke="#a2542f" stroke-width="2"/>
        <polyline points="962,424 972,418 966,410" fill="none" stroke="#a2542f" stroke-width="2"/>
      </g>

      <!-- running log line -->
      <g id="state-log" font-size="15" font-style="italic" fill="#a2542f">
        <text x="756" y="470">Sat 11:05 - delivery logged</text>
        <text x="880" y="496">Mon 08:30 - RFI #114 issued</text>
      </g>
    </g>

    <!-- ============ CENTER: PROJECTR AS THE LIVE LINK ============ -->
    <g id="projectr-link">
      <g id="arrows" stroke="#1a1a1a" stroke-width="3" fill="none">
        <line x1="488" y1="226" x2="700" y2="226"/>
        <line x1="712" y1="334" x2="500" y2="334"/>
      </g>
      <polygon id="arrowhead-right" points="714,226 694,216 694,236" fill="#1a1a1a"/>
      <polygon id="arrowhead-left" points="486,334 506,324 506,344" fill="#1a1a1a"/>
      <rect id="wordmark-chip" x="498" y="254" width="204" height="56" fill="#fbfaf7"/>
      <text id="wordmark" x="600" y="293" text-anchor="middle" font-size="50" fill="#1a1a1a">Projectr</text>
      <text id="link-caption" x="600" y="384" text-anchor="middle" font-size="18" font-style="italic" fill="#5a5a5a">the live link</text>
    </g>
  </g>
</svg>
